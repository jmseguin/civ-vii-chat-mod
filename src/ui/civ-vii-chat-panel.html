<div class="civ-vii-chat-frame pointer-events-auto">
  <div class="civ-vii-chat">
    <div class="civ-vii-chat__top">
      <div class="civ-vii-chat__emblem"></div>
      <div class="civ-vii-chat__title" data-l10n-id="LOC_CIV_VII_CHAT_HEADER"></div>
      <fxs-close-button class="civ-vii-chat__close"></fxs-close-button>
    </div>
    <div class="civ-vii-chat__roster"></div>
    <div class="civ-vii-chat__log">
      <div class="civ-vii-chat__messages"></div>
      <div class="civ-vii-chat__empty" data-l10n-id="LOC_CIV_VII_CHAT_EMPTY"></div>
    </div>
    <div class="civ-vii-chat__composer">
      <div class="civ-vii-chat__suggest civ-vii-chat--hidden"></div>
      <div class="civ-vii-chat__target civ-vii-chat--hidden"></div>
      <textarea class="civ-vii-chat__input" rows="2" maxlength="500" tabindex="0"></textarea>
      <fxs-activatable class="civ-vii-chat__send" role="button" tabindex="0"></fxs-activatable>
    </div>
  </div>
</div>
